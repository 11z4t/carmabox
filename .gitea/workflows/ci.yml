name: CARMA Box CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Test + Manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements-dev.txt
          pip install ruff pytest pytest-cov

      - name: Ruff lint
        run: ruff check custom_components/ tests/

      - name: Ruff format check
        run: ruff format --check custom_components/ tests/

      - name: Pytest
        run: pytest tests/ -q --tb=short

      - name: Manifest validation
        run: |
          python - << 'PYEOF'
          import json, pathlib, sys

          # EEBS guard (2026-08-01): this check must not silently pass when it finds
          # nothing to check. An empty rglob (wrong cwd, custom_components/ missing or
          # renamed) previously exited 0 with zero output — indistinguishable from
          # "all manifests valid." Assert a minimum count instead.
          MIN_EXPECTED_MANIFESTS = 5  # binary_balancer, carmabox, bat_balancer, ev_balancer, brain

          manifests = list(pathlib.Path("custom_components").rglob("manifest.json"))
          if len(manifests) < MIN_EXPECTED_MANIFESTS:
              print(
                  f"FAIL: found {len(manifests)} manifest.json files, expected at least "
                  f"{MIN_EXPECTED_MANIFESTS}. Wrong working directory, or custom_components/ "
                  f"missing/renamed — this check cannot silently pass on zero input."
              )
              sys.exit(1)

          ok = True
          for mf in manifests:
              data = json.loads(mf.read_text())
              name = data.get("name", "")
              domain = data.get("domain", "")
              owners = data.get("codeowners", [])
              if not name.startswith("CARMA "):
                  print(f"FAIL {mf}: name '{name}' must start with 'CARMA '")
                  ok = False
              if "@carma" not in owners:
                  print(f"FAIL {mf}: codeowners must include '@carma'")
                  ok = False
              print(f"OK   {domain}: '{name}' {owners}")
          print(f"Checked {len(manifests)} manifest.json files.")
          sys.exit(0 if ok else 1)
          PYEOF
