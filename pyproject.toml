[project]
name = "carmabox"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--ignore=tests/e2e --ignore=tests/integration"
markers = ["e2e: end-to-end tests requiring HA + browser (deselected by default)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "C90", "SIM", "TCH", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "N802", "E501", "RUF002", "RUF003", "SIM103", "SIM117", "C408"]
# Migrated CCs (brain/ev_balancer/bat_balancer/binary_balancer) — pre-existing issues, fix incrementally
"custom_components/brain/*" = ["ANN", "TCH", "E501", "N806", "RUF002", "RUF003"]
"custom_components/ev_balancer/*" = ["ANN", "TCH", "TC001", "SIM", "E501", "RUF002", "RUF003"]
"custom_components/bat_balancer/*" = ["ANN", "TCH", "E501", "RUF003"]
"custom_components/binary_balancer/*" = ["ANN", "TCH", "RUF002", "RUF003"]
"custom_components/vp_pool_balancer/*" = ["ANN", "TCH", "TC001", "TC002", "F841", "F401", "RUF100", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "paho"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "custom_components.carmabox.hub"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "custom_components.carmabox.coordinator"
warn_unused_ignores = false


[tool.coverage.run]
source = ["custom_components/carmabox"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
