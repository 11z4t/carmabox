<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0500" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Lightning bolt / energy symbol -->
  <polygon points="296,68 168,276 244,276 216,444 344,236 268,236" fill="url(#bolt)"/>
  <!-- Subtle inner glow ring -->
  <rect width="512" height="512" rx="96" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>
</svg>
